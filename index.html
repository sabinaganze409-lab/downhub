<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DownHub - Téléchargement Direct</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    header { max-width: 1100px; margin: 0 auto 30px; text-align: center; }
    h1 { font-size: 2.5rem; margin-bottom: 20px; color: #38bdf8; }
    
    .search-bar { width: 100%; max-width: 600px; padding: 14px 20px; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 1rem; outline: none; margin-bottom: 20px; }
    .search-bar:focus { border-color: #38bdf8; }

    .filters { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; }
    .filter-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: #0284c7; color: #fff; border-color: #0284c7; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 16px; padding: 20px; border: 1px solid #334155; display: flex; flex-direction: column; align-items: center; text-align: center; transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 70px; height: 70px; border-radius: 16px; object-fit: cover; margin-bottom: 15px; }
    .card h3 { font-size: 1.1rem; margin-bottom: 5px; color: #f1f5f9; }
    .card .info { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; }
    
    .btn-download { display: inline-block; width: 100%; padding: 10px; background: #0284c7; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.2s; }
    .btn-download:hover { background: #0369a1; }
  </style>
</head>
<body>

  <header>
    <h1>DownHub</h1>
    <input type="text" id="searchInput" class="search-bar" placeholder="Rechercher une application, un jeu...">
    <div class="filters">
      <button class="filter-btn active" onclick="filterApps('Tous')">Tous</button>
      <button class="filter-btn" onclick="filterApps('Android')">Android</button>
      <button class="filter-btn" onclick="filterApps('Windows')">Windows</button>
      <button class="filter-btn" onclick="filterApps('Mac')">Mac</button>
    </div>
  </header>

  <main class="grid" id="appsGrid">
    <!-- Les applications s'afficheront ici dynamiquement -->
  </main>

  <script>
    let allApps = [];

    // Charger les données depuis le fichier JSON
    async function loadApps() {
      try {
        const response = await fetch('apps.json');
        allApps = await response.json();
        renderApps(allApps);
      } catch (error) {
        console.error("Erreur de chargement des applications :", error);
      }
    }

    // Afficher les applications sur la page
    function renderApps(apps) {
      const grid = document.getElementById('appsGrid');
      grid.innerHTML = '';
      
      if (apps.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">Aucune application trouvée.</p>';
        return;
      }

      apps.forEach(app => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${app.icon}" alt="${app.name}">
          <h3>${app.name}</h3>
          <div class="info">★ ${app.rating} • ${app.size}</div>
          <a href="${app.downloadUrl}" class="btn-download" download>Télécharger</a>
        `;
        grid.appendChild(card);
      });
    }

    // Filtrer par recherche
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase();
      const filtered = allApps.filter(app => app.name.toLowerCase().includes(searchTerm));
      renderApps(filtered);
    });

    // Filtrer par catégorie
    function filterApps(category) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (category === 'Tous') {
        renderApps(allApps);
      } else {
        const filtered = allApps.filter(app => app.category === category);
        renderApps(filtered);
      }
    }

    // Lancement au chargement de la page
    loadApps();
  </script>
</body>
</html>
