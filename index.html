<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DownHub Studio — Projets & Contacts Directs</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --whatsapp-color: #25d366;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #334155;
        }

        h1 { color: var(--accent); margin-bottom: 5px; }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        .card h3 { color: var(--accent); margin-top: 0; }

        .progress-bar-bg {
            background-color: #334155;
            border-radius: 8px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-bar-fill {
            background-color: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            background-color: #0284c7;
        }

        .btn-whatsapp {
            background-color: var(--whatsapp-color);
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
            display: block;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }

        .btn-whatsapp:hover { background-color: #1eb854; }

        .form-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            max-width: 600px;
            margin: 40px auto;
            border: 1px solid #334155;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        .btn-submit {
            background-color: var(--whatsapp-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-submit:hover { background-color: #1eb854; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ DownHub Studio</h1>
        <p>Projets en développement & Contact direct WhatsApp</p>
    </header>

    <!-- LISTE DES APPLICATIONS -->
    <main class="container" id="apps-container">
        <!-- Rempli automatiquement par la liste locale -->
    </main>

    <!-- FORMULAIRE 1 : INSCRIPTION AU BÊTA-TEST -->
    <section class="form-section">
        <h2>🚀 Devenir Bêta-Testeur</h2>
        <form id="beta-form">
            <label for="userName">Nom / Pseudo :</label>
            <input type="text" id="userName" required placeholder="Ex: Sabin">

            <label for="userEmail">Téléphone / WhatsApp :</label>
            <input type="text" id="userEmail" required placeholder="Votre numéro de téléphone">

            <label for="appSelect">Application concernée :</label>
            <select id="appSelect"></select>

            <button type="submit" class="btn-submit">📲 S'inscrire & Envoyer sur WhatsApp</button>
        </form>
    </section>

    <!-- FORMULAIRE 2 : PROPOSER UNE SUGGESTION -->
    <section class="form-section">
        <h2>💡 Soumettre une Idée / Suggestion</h2>
        <form id="suggestion-form">
            <label for="sugName">Votre Nom / Pseudo :</label>
            <input type="text" id="sugName" required placeholder="Ex: Alex">

            <label for="sugTitle">Titre de l'idée :</label>
            <input type="text" id="sugTitle" required placeholder="Ex: Mode sombre ou nouvelle option">

            <label for="sugCategory">Catégorie :</label>
            <select id="sugCategory">
                <option value="Nouvelle Fonctionnalité">Nouvelle Fonctionnalité</option>
                <option value="Signalement de Bug">Signalement de Bug</option>
                <option value="Autre Projet">Autre Projet</option>
            </select>

            <label for="sugDesc">Détails de votre suggestion :</label>
            <textarea id="sugDesc" rows="4" required placeholder="Décrivez votre idée..."></textarea>

            <button type="submit" class="btn-submit">💡 Envoyer la Suggestion sur WhatsApp</button>
        </form>
    </section>

    <script>
        // Numéro WhatsApp configuré
        const WHATSAPP_NUMBER = "24398169812";

        // Liste locale de tes projets (tu peux directement modifier le pourcentage et les détails ici)
        const myApps = [
            {
                id: "downhub-app",
                title: "DownHub Store",
                description: "Catalogue d'applications et outils en téléchargement direct.",
                status: "EN COURS",
                progress: 85
            },
            {
                id: "downhub-vpn",
                title: "DownHub VPN",
                description: "Application de connexion sécurisée et rapide.",
                status: "PLANIFIÉ",
                progress: 40
            },
            {
                id: "downhub-ai",
                title: "DownHub Assistant AI",
                description: "Assistant virtuel intelligent intégré.",
                status: "CONCEPT",
                progress: 20
            }
        ];

        // 1. Affichage des applications sur la page
        function displayApps() {
            const container = document.getElementById('apps-container');
            const select = document.getElementById('appSelect');

            container.innerHTML = "";
            select.innerHTML = "";

            myApps.forEach(app => {
                const msg = encodeURIComponent(`Bonjour ! Je souhaite avoir des informations sur : ${app.title}`);
                const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="badge">${app.status}</span>
                    <h3>${app.title}</h3>
                    <p>${app.description}</p>
                    <div>Avancement : <strong>${app.progress}%</strong></div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: ${app.progress}%;"></div>
                    </div>
                    <a href="${waUrl}" target="_blank" class="btn-whatsapp">💬 Discuter du projet</a>
                `;
                container.appendChild(card);

                const option = document.createElement('option');
                option.value = app.title;
                option.textContent = app.title;
                select.appendChild(option);
            });
        }

        // 2. Inscription Bêta -> WhatsApp
        document.getElementById('beta-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('userName').value;
            const contact = document.getElementById('userEmail').value;
            const appName = document.getElementById('appSelect').value;

            const text = `🚀 *INSCRIPTION BÊTA TEST*\n\n` +
                         `👤 *Nom* : ${name}\n` +
                         `📞 *Contact* : ${contact}\n` +
                         `📱 *Application* : ${appName}`;

            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
            document.getElementById('beta-form').reset();
        });

        // 3. Suggestion -> WhatsApp
        document.getElementById('suggestion-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('sugName').value;
            const title = document.getElementById('sugTitle').value;
            const category = document.getElementById('sugCategory').value;
            const description = document.getElementById('sugDesc').value;

            const text = `💡 *NOUVELLE SUGGESTION*\n\n` +
                         `👤 *De* : ${name}\n` +
                         `📌 *Titre* : ${title}\n` +
                         `🏷️ *Catégorie* : ${category}\n` +
                         `📝 *Détails* :\n${description}`;

            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
            document.getElementById('suggestion-form').reset();
        });

        // Charger les données au démarrage
        displayApps();
    </script>
</body>
</html>
