<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DownHub Studio — Catalogue d'Applications</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Background Glows -->
  <div class="bg-glow top-left"></div>
  <div class="bg-glow top-right"></div>

  <!-- Header -->
  <header>
    <div class="logo">
      <i class="fa-solid fa-bolt text-accent"></i> DownHub Studio
    </div>
    <div class="header-actions">
      <button class="btn btn-outline" onclick="openModal('suggestModal')">
        <i class="fa-solid fa-lightbulb"></i> Suggérer une idée
      </button>
      <div class="social-links">
        <a href="#" target="_blank"><i class="fa-brands fa-telegram"></i></a>
        <a href="#" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
        <a href="#" target="_blank"><i class="fa-brands fa-discord"></i></a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Catalogue d'Applications</h1>
    <p>Nos projets Android et logiciels en cours de développement.</p>
    
    <!-- Controls (Search & Filter) -->
    <div class="controls">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Rechercher une application..." oninput="filterApps()">
      </div>
      <div class="filter-buttons">
        <button class="filter-btn active" onclick="setFilter('ALL', this)">Tous</button>
        <button class="filter-btn" onclick="setFilter('EN COURS', this)">En cours</button>
        <button class="filter-btn" onclick="setFilter('PLANIFIÉ', this)">Planifié</button>
        <button class="filter-btn" onclick="setFilter('CONCEPT', this)">Concept</button>
      </div>
    </div>
  </section>

  <!-- Apps Grid -->
  <main class="grid-container" id="appsGrid">
    <!-- Injecté dynamiquement par app.js -->
  </main>

  <!-- Modal: Inscription Bêta -->
  <div class="modal-overlay" id="betaModal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal('betaModal')">&times;</button>
      <h3><i class="fa-solid fa-rocket"></i> Rejoindre la Bêta</h3>
      <p id="betaAppTitle">Application : </p>
      <form id="betaForm" onsubmit="handleBetaSubmit(event)">
        <input type="hidden" id="betaAppId">
        <div class="input-group">
          <label>Votre nom / pseudo</label>
          <input type="text" id="betaName" required placeholder="Ex: Alex">
        </div>
        <div class="input-group">
          <label>Votre Adresse Email</label>
          <input type="email" id="betaEmail" required placeholder="exemple@gmail.com">
        </div>
        <button type="submit" class="btn btn-primary btn-block">S'inscrire</button>
      </form>
    </div>
  </div>

  <!-- Modal: Suggérer une idée -->
  <div class="modal-overlay" id="suggestModal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal('suggestModal')">&times;</button>
      <h3><i class="fa-solid fa-lightbulb"></i> Proposer une idée</h3>
      <p>Proposez une application que vous aimeriez voir développée !</p>
      <form id="suggestForm" onsubmit="handleSuggestSubmit(event)">
        <div class="input-group">
          <label>Titre de l'application</label>
          <input type="text" id="suggestTitle" required placeholder="Ex: Clean Master Lite">
        </div>
        <div class="input-group">
          <label>Catégorie</label>
          <input type="text" id="suggestCategory" required placeholder="Ex: Sécurité, Multimédia...">
        </div>
        <div class="input-group">
          <label>Description des fonctionnalités</label>
          <textarea id="suggestDesc" rows="4" required placeholder="Décrivez l'application..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Envoyer l'idée</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>© 2026 <strong>DownHub Studio</strong> — Par Sabin Aganze Ntibonerha.</p>
  </footer>

  <!-- Si ton fichier sur GitHub s'appelle script.js, mets ceci : -->
<script src="script.js"></script>
</body>
</html>
