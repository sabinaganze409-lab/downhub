<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DownHub Studio — Plateforme Officielle</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: rgba(19, 30, 54, 0.85);
            --accent: #38bdf8;
            --whatsapp-color: #25d366;
            --text-color: #f8fafc;
            --border-color: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(37, 211, 102, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.5) 0px, transparent 100%);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 0 20px;
        }

        header h1 {
            color: var(--accent);
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        header p {
            color: #94a3b8;
            margin: 0;
            font-size: 1.05rem;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card h3 {
            color: #ffffff;
            margin: 0;
            font-size: 1.25rem;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .badge-encours { background-color: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid #38bdf8; }
        .badge-planifie { background-color: rgba(251, 146, 60, 0.15); color: #fb923c; border: 1px solid #fb923c; }
        .badge-concept { background-color: rgba(168, 85, 247, 0.15); color: #a855f7; border: 1px solid #a855f7; }

        .card p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0 0 20px 0;
        }

        .progress-section {
            margin-bottom: 20px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            background-color: #0b1220;
            border-radius: 10px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-bar-fill {
            background-color: var(--accent);
            height: 100%;
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn-vote {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            transition: background-color 0.2s;
        }

        .btn-vote:hover { background-color: #1d4ed8; }

        .btn-whatsapp-card {
            background-color: var(--whatsapp-color);
            color: white;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            flex: 1;
            transition: background-color 0.2s;
        }

        .btn-whatsapp-card:hover { background-color: #1eb854; }

        .form-section {
            background-color: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            max-width: 650px;
            margin: 40px auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .form-section h2 {
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: rgba(11, 18, 32, 0.8);
            color: white;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-submit {
            background-color: var(--whatsapp-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover { background-color: #1eb854; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ DownHub Studio</h1>
        <p>Projets en développement & Interactions en direct</p>
    </header>

    <!-- LISTE DES APPLICATIONS -->
    <main class="container" id="apps-container">Chargement des projets...</main>

    <!-- FORMULAIRE BÊTA-TEST -->
    <section class="form-section">
        <h2>🚀 Devenir Bêta-Testeur</h2>
        <form id="beta-form">
            <label for="userName">Nom / Pseudo :</label>
            <input type="text" id="userName" required placeholder="Ex: Sabin">

            <label for="userEmail">Adresse Email ou Téléphone :</label>
            <input type="text" id="userEmail" required placeholder="Email ou numéro WhatsApp">

            <label for="appSelect">Application concernée :</label>
            <select id="appSelect"></select>

            <button type="submit" class="btn-submit">📲 S'inscrire & Envoyer via WhatsApp</button>
        </form>
    </section>

    <!-- FORMULAIRE SUGGESTION -->
    <section class="form-section">
        <h2>💡 Soumettre une Idée / Suggestion</h2>
        <form id="suggestion-form">
            <label for="sugName">Votre Nom / Pseudo :</label>
            <input type="text" id="sugName" required placeholder="Ex: Alex">

            <label for="sugTitle">Titre de l'idée :</label>
            <input type="text" id="sugTitle" required placeholder="Ex: Ajouter un mode sombre">

            <label for="sugCategory">Catégorie :</label>
            <select id="sugCategory">
                <option value="Nouvelle Fonctionnalité">Nouvelle Fonctionnalité</option>
                <option value="Signalement de Bug">Signalement de Bug</option>
                <option value="Autre Projet">Idée de nouveau projet</option>
            </select>

            <label for="sugDesc">Détails de votre suggestion :</label>
            <textarea id="sugDesc" rows="4" required placeholder="Décrivez votre idée en détail..."></textarea>

            <button type="submit" class="btn-submit">💡 Envoyer la Suggestion sur WhatsApp</button>
        </form>
    </section>

    <script>
        const WHATSAPP_NUMBER = "24398169812";
        // URL de l'API Node.js (remplace par ton URL d'hébergement une fois en ligne)
        const API_URL = "http://localhost:3000/api";

        // Charger les applications en direct depuis le serveur API
        async function fetchApps() {
            try {
                const res = await fetch(`${API_URL}/apps`);
                const appsData = await res.json();

                const container = document.getElementById('apps-container');
                const select = document.getElementById('appSelect');

                container.innerHTML = "";
                select.innerHTML = "";

                appsData.forEach(app => {
                    const msg = encodeURIComponent(`Bonjour ! Je vous contacte au sujet de l'application ${app.title}.`);
                    const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <div class="card-header">
                                <h3>${app.title}</h3>
                                <span class="badge ${app.badgeClass}">${app.status}</span>
                            </div>
                            <p>${app.description}</p>
                        </div>
                        <div>
                            <div class="progress-section">
                                <div class="progress-info">
                                    <span>Avancement</span>
                                    <span><strong>${app.progress}%</strong></span>
                                </div>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" style="width: ${app.progress}%;"></div>
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="btn-vote" onclick="sendVote('${app.id}')">👍 Voter (${app.votes})</button>
                                <a href="${waUrl}" target="_blank" class="btn-whatsapp-card">💬 WhatsApp</a>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);

                    const option = document.createElement('option');
                    option.value = app.title;
                    option.textContent = app.title;
                    select.appendChild(option);
                });
            } catch (err) {
                document.getElementById('apps-container').innerHTML = "<p style='text-align:center;'>Connexion au serveur API en cours ou indisponible...</p>";
            }
        }

        // Envoyer le vote au serveur (Bloqué par IP si doublon)
        async function sendVote(appId) {
            try {
                const res = await fetch(`${API_URL}/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ appId })
                });

                const data = await res.json();
                alert(data.message || data.error);
                fetchApps(); // Recharger la liste pour afficher le compteur mis à jour
            } catch (err) {
                alert("Impossible d'enregistrer le vote.");
            }
        }

        // Envoi Bêta-Test -> WhatsApp
        document.getElementById('beta-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('userName').value;
            const contact = document.getElementById('userEmail').value;
            const appName = document.getElementById('appSelect').value;

            const text = `🚀 *NOUVELLE INSCRIPTION BÊTA TEST*\n\n` +
                         `👤 *Nom* : ${name}\n` +
                         `📞 *Contact* : ${contact}\n` +
                         `📱 *Application* : ${appName}`;

            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
            document.getElementById('beta-form').reset();
        });

        // Envoi Suggestion -> WhatsApp
        document.getElementById('suggestion-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('sugName').value;
            const title = document.getElementById('sugTitle').value;
            const category = document.getElementById('sugCategory').value;
            const description = document.getElementById('sugDesc').value;

            const text = `💡 *NOUVELLE SUGGESTION UTILISATEUR*\n\n` +
                         `👤 *De* : ${name}\n` +
                         `📌 *Titre* : ${title}\n` +
                         `🏷️ *Catégorie* : ${category}\n` +
                         `📝 *Message* :\n${description}`;

            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
            document.getElementById('suggestion-form').reset();
        });

        // Chargement initial au démarrage
        fetchApps();
    </script>
</body>
</html>
