<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DownHub Studio — Catalogue & Projets</title>
    <!-- Chargement de la bibliothèque officielle Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #334155;
        }

        h1 { color: var(--accent); margin-bottom: 5px; }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        .card h3 { color: var(--accent); margin-top: 0; }

        .progress-bar-bg {
            background-color: #334155;
            border-radius: 8px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-bar-fill {
            background-color: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            background-color: #0284c7;
        }

        .btn-vote {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-vote:hover { background-color: #1d4ed8; }

        .form-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            max-width: 600px;
            margin: 40px auto;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        button[type="submit"] {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        button[type="submit"]:hover { background-color: #059669; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ DownHub Studio</h1>
        <p>Projets en développement & Inscriptions au Bêta-test</p>
    </header>

    <!-- Liste dynamique des applications -->
    <main class="container" id="apps-container">
        <p>Chargement des applications en cours...</p>
    </main>

    <!-- Formulaire d'inscription au Bêta Test -->
    <section class="form-section">
        <h2>🚀 Devenir Bêta-Testeur</h2>
        <form id="beta-form">
            <label for="userName">Nom / Pseudo :</label>
            <input type="text" id="userName" required placeholder="Ex: Sabin">

            <label for="userEmail">Adresse Email :</label>
            <input type="email" id="userEmail" required placeholder="votre@email.com">

            <label for="appSelect">Application souhaitée :</label>
            <select id="appSelect">
                <!-- Rempli automatiquement depuis Supabase -->
            </select>

            <button type="submit">Rejoindre le Bêta Test</button>
        </form>
    </section>

    <!-- CODE JAVASCRIPT CONNECTÉ À SUPABASE -->
    <script>
        // --- VOS IDENTIFIANTS SUPABASE INTÉGRÉS ---
        const SUPABASE_URL = "https://efwmuefadqrebnxakbic.supabase.co";[cite: 5]
        
        // Colle ci-dessous la totalité de ta clef 'Publishable key' affichée dans tes paramètres Supabase API Keys
        const SUPABASE_ANON_KEY = "sb_publishable_eW35mxTRViE7k0pH5QIM3Q_GvWyD4GA";[cite: 7]

        // Initialisation du client Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- 1. CHARGER ET AFFICHER LES APPLICATIONS EN DIRECT ---
        async function loadApps() {
            const container = document.getElementById('apps-container');
            const select = document.getElementById('appSelect');

            const { data: apps, error } = await supabase
                .from('apps')
                .select('*');

            if (error) {
                console.error("Erreur lors du chargement :", error);
                container.innerHTML = "<p>Erreur de connexion aux données.</p>";
                return;
            }

            container.innerHTML = "";
            select.innerHTML = "";

            apps.forEach(app => {
                // Création des cartes pour chaque application
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="badge">${app.status || 'EN COURS'}</span>
                    <h3>${app.title}</h3>
                    <p>${app.description || ''}</p>
                    <div>Avancement : <strong>${app.progress || 0}%</strong></div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: ${app.progress || 0}%;"></div>
                    </div>
                    <button class="btn-vote" onclick="voteForApp('${app.id}', ${app.votes || 0})">
                        👍 Voter (${app.votes || 0})
                    </button>
                `;
                container.appendChild(card);

                // Ajout des options au menu déroulant du Bêta-test
                const option = document.createElement('option');
                option.value = app.id;
                option.textContent = app.title;
                select.appendChild(option);
            });
        }

        // --- 2. GÉRER LES VOTES ---
        async function voteForApp(appId, currentVotes) {
            const { error } = await supabase
                .from('apps')
                .update({ votes: currentVotes + 1 })
                .eq('id', appId);

            if (error) {
                alert("Erreur lors du vote !");
            } else {
                loadApps(); // Recharger les données actualisées
            }
        }

        // --- 3. ENREGISTRER UN BÊTA-TESTEUR ---
        document.getElementById('beta-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;
            const appId = document.getElementById('appSelect').value;

            const { error } = await supabase
                .from('beta_requests')
                .insert([{ user_name: name, email: email, app_id: appId }]);

            if (error) {
                alert("Erreur d'inscription : " + error.message);
            } else {
                alert("Merci ! Votre demande pour le bêta-test a été enregistrée.");
                document.getElementById('beta-form').reset();
            }
        });

        // Lancement au chargement de la page
        loadApps();
    </script>
</body>
</html>
