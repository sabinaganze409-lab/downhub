<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DownHub - Téléchargement d'Applications</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome pour les icônes (Partage, Loupe, etc.) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <h1>DownHub</h1>
        <!-- Barre de recherche réparée -->
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="search-input" placeholder="Rechercher une application ou un jeu..." oninput="handleSearch()">
        </div>
    </header>

    <main>
        <!-- Boutons de filtres / catégories -->
        <div class="category-tabs">
            <button class="tab-btn active" onclick="switchCategory('all', this)">Tous</button>
            <button class="tab-btn" onclick="switchCategory('android', this)">Android</button>
            <button class="tab-btn" onclick="switchCategory('windows', this)">Windows</button>
            <button class="tab-btn" onclick="switchCategory('mac', this)">Mac</button>
            <button class="tab-btn" onclick="switchCategory('jeux', this)">Jeux</button>
            <button class="tab-btn" onclick="switchCategory('vpn', this)">VPN</button>
        </div>

        <!-- Zone d'affichage des cartes d'applications -->
        <div id="apps-container" class="apps-grid"></div>

        <!-- Bouton pour charger les applications suivantes -->
        <div style="text-align: center; margin: 25px 0;">
            <button id="load-more-btn" onclick="loadMoreApps()" style="display: none; padding: 12px 28px; background: #007bff; color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 1em; font-weight: bold;">
                Charger plus d'applications
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
