<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppStore - Téléchargez vos applications</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Barre de Navigation -->
  <header class="navbar">
    <div class="logo">
      <i class="fa-solid fa-cloud-arrow-down logo-icon"></i>
      <span>DownHub</span>
    </div>
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" placeholder="Rechercher des applications, jeux...">
    </div>
    <nav class="nav-links">
      <a href="#android-section">Android</a>
      <a href="#windows-section">Windows</a>
      <a href="#mac-section">Mac</a>
      <a href="#" class="btn-login">Connexion</a>
    </nav>
  </header>

  <!-- Section Vedette (Hero) -->
  <section class="hero-section">
    <div class="hero-card">
      <div class="hero-badge"><i class="fa-solid fa-fire"></i> Application du jour</div>
      <h1>PUBG MOBILE</h1>
      <p>Le jeu de battle royale ultime sur mobile. Sautez, armez-vous et survissez.</p>
      <div class="hero-actions">
        <a href="https://play.google.com/store/apps/details?id=com.tencent.ig" target="_blank" class="btn-download"><i class="fa-solid fa-download"></i> Télécharger (1.2 GB)</a>
        <span class="version-tag">v3.1.0 • Gratuit</span>
      </div>
    </div>
  </section>

  <!-- Grille d'applications générée par script.js -->
  <main class="container">
    <h2 class="section-title">Toutes les Applications & Jeux</h2>
    
    <!-- C'est ici que le JavaScript va injecter toutes les cartes d'applications -->
    <div id="apps-list" class="apps-grid"></div>

    <h2 class="section-title" id="android-section" style="margin-top: 40px;">Android</h2>
    <div id="android-list"></div>

    <h2 class="section-title" id="windows-section" style="margin-top: 40px;">Windows</h2>
    <div id="windows-list"></div>

    <h2 class="section-title" id="mac-section" style="margin-top: 40px;">Mac</h2>
    <div id="mac-list"></div>

    <h2 class="section-title" style="margin-top: 40px;">Jeux</h2>
    <div id="jeux-list"></div>
  </main>

  <!-- Lien vers le fichier JavaScript (OBLIGATOIRE) -->
  <script src="script.js"></script>

</body>
</html>
