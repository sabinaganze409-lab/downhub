<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DownHub - Téléchargement d'applications Android gratuit</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- EN-TÊTE / NAVBAR -->
  <header class="navbar">
    <div class="logo">
      <span class="logo-down">Down</span><span class="logo-hub">Hub</span>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Rechercher des jeux, applications...">
    </div>
  </header>

  <main class="main-content">
    
    <!-- SECTION VEDETTE & TENDANCES -->
    <section class="hero-section">
      <div class="featured-card">
        <span class="badge-featured">À LA UNE</span>
        <h1 class="featured-title">Ragdoll Playground</h1>
        <p class="featured-desc">Jeu d'action sandbox physique ultra populaire ! Nouveaux objets disponibles.</p>
        <button class="featured-btn">Télécharger v3.20 (25 MB)</button>
      </div>

      <div class="sidebar-cards">
        <div class="trending-card">
          <h3>Recherches Tendance</h3>
          <div class="trending-tags">
            <span class="tag" onclick="filterAppsBySearch('Free Fire')">Free Fire</span>
            <span class="tag" onclick="filterAppsBySearch('WhatsApp')">WhatsApp</span>
            <span class="tag" onclick="filterAppsBySearch('GTA')">GTA San Andreas</span>
            <span class="tag" onclick="filterAppsBySearch('CapCut')">CapCut</span>
          </div>
        </div>

        <div class="promo-card">
          <h3>DownHub VPN (Offert)</h3>
          <p>Accès Internet sécurisé et fluide. Application officielle.</p>
          <button class="promo-btn" onclick="switchCategory('vpn')">Obtenir l'APK</button>
        </div>
      </div>
    </section>

    <!-- BOUTONS DE CATÉGORIES -->
    <section class="category-tabs">
      <button class="tab-btn active" onclick="switchCategory('all', this)">Tous</button>
      <button class="tab-btn" onclick="switchCategory('android', this)">Android</button>
      <button class="tab-btn" onclick="switchCategory('jeux', this)">Jeux</button>
      <button class="tab-btn" onclick="switchCategory('vpn', this)">VPN</button>
      <button class="tab-btn" onclick="switchCategory('outils', this)">Outils</button>
    </section>

    <!-- GRILLE D'APPLICATIONS -->
    <section class="catalog-section">
      <h2 class="section-title">Découvrir les Applications</h2>
      <div id="apps-grid" class="apps-grid">
        <!-- Les applications chargées par script.js s'afficheront ici -->
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
